<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff3d6">
    <title>Ñoquis para Martina</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='36' rx='26' ry='16' fill='%23fff6dc' stroke='%231c1c1c' stroke-width='4'/%3E%3Ccircle cx='24' cy='34' r='3' fill='%231c1c1c'/%3E%3Ccircle cx='40' cy='34' r='3' fill='%231c1c1c'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="stage" id="stage" data-index="0" role="region" aria-roledescription="carrusel" aria-label="Invitación a los ñoquis">
      <div class="track" id="track">
        <section class="slide" role="group" aria-roledescription="diapositiva" aria-label="1 de 4">
          <div class="slide-inner">
            <h1>Martina</h1>
            <svg class="gnocchi" viewBox="0 0 240 150" aria-hidden="true">
              <ellipse cx="120" cy="84" rx="96" ry="48" fill="#fff6dc" stroke="#1c1c1c" stroke-width="4"/>
              <path d="M62 52c10 22 10 48 0 68M100 44c12 24 12 62 0 86M140 44c12 24 12 62 0 86M178 52c10 22 10 48 0 68" fill="none" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round"/>
              <ellipse cx="78" cy="96" rx="12" ry="7" fill="#ff8aa0"/>
              <ellipse cx="164" cy="96" rx="12" ry="7" fill="#ff8aa0"/>
              <g class="eyes">
                <ellipse cx="98" cy="80" rx="8" ry="11" fill="#1c1c1c"/>
                <ellipse cx="146" cy="80" rx="8" ry="11" fill="#1c1c1c"/>
                <ellipse cx="100" cy="76" rx="3" ry="3" fill="#fffaf0"/>
                <ellipse cx="148" cy="76" rx="3" ry="3" fill="#fffaf0"/>
              </g>
              <path d="M104 104c8 12 24 12 32 0" fill="none" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <p class="lead">Este domingo hay ñoquis.</p>
            <p>De papa. Caseros. Hechos por Max.</p>
          </div>
          <p class="hint">
            <svg class="hint-icon" viewBox="0 0 80 70" aria-hidden="true">
              <ellipse cx="40" cy="40" rx="28" ry="22" fill="#ffc93c" stroke="#1c1c1c" stroke-width="4"/>
              <path d="M46 18c2-8 10-12 10-12" fill="none" stroke="#2fbf71" stroke-width="4" stroke-linecap="round"/>
              <circle cx="32" cy="38" r="3" fill="#1c1c1c"/>
              <circle cx="48" cy="38" r="3" fill="#1c1c1c"/>
              <path d="M33 50c4 4 10 4 14 0" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span>bajá</span>
          </p>
        </section>

        <section class="slide" role="group" aria-roledescription="diapositiva" aria-label="2 de 4">
          <div class="slide-inner">
            <h2>Los hago yo. Los tres.</h2>
            <div class="stickers">
              <ul class="sticker-row">
                <li class="sticker sticker-a">
                  <svg viewBox="0 0 80 70" aria-hidden="true">
                    <ellipse cx="40" cy="40" rx="28" ry="22" fill="#ffc93c" stroke="#1c1c1c" stroke-width="4"/>
                    <path d="M46 18c2-8 10-12 10-12" fill="none" stroke="#2fbf71" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="32" cy="38" r="3" fill="#1c1c1c"/>
                    <circle cx="48" cy="38" r="3" fill="#1c1c1c"/>
                    <path d="M33 50c4 4 10 4 14 0" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/>
                  </svg>
                  <span>La papa</span>
                </li>
                <li class="sticker sticker-b">
                  <svg viewBox="0 0 90 80" aria-hidden="true">
                    <path d="M20 36h50l-6 30H26z" fill="#ff4d3a" stroke="#1c1c1c" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M16 36h58" fill="none" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round"/>
                    <path d="M30 36c2-16 28-16 30 0" fill="#e23b2c" stroke="#1c1c1c" stroke-width="4"/>
                    <ellipse cx="64" cy="24" rx="9" ry="5" fill="#2fbf71" stroke="#1c1c1c" stroke-width="3"/>
                  </svg>
                  <span>La salsa</span>
                </li>
                <li class="sticker sticker-c">
                  <svg viewBox="0 0 80 74" aria-hidden="true">
                    <path d="M40 66C16 50 8 36 8 24 8 14 16 8 26 8c6 0 11 3 14 8 3-5 8-8 14-8 10 0 18 6 18 16 0 12-8 26-32 42z" fill="#ff4d3a" stroke="#1c1c1c" stroke-width="4" stroke-linejoin="round"/>
                  </svg>
                  <span>El cariño</span>
                </li>
              </ul>
            </div>
          </div>
        </section>

        <section class="slide" role="group" aria-roledescription="diapositiva" aria-label="3 de 4">
          <div class="slide-inner">
            <div class="sign">
              <p class="sign-kicker">Este</p>
              <p class="sign-day">Domingo 29</p>
              <p class="sign-sub">De noviembre. Yo cocino.</p>
            </div>
          </div>
        </section>

        <section class="slide" role="group" aria-roledescription="diapositiva" aria-label="4 de 4">
          <div class="slide-inner">
            <div class="ask">
              <h2>Entonces, Martina</h2>
              <button type="button" class="btn btn-yes" id="accept">Aceptar</button>
            </div>
          </div>
        </section>
      </div>

      <div class="hud">
        <button type="button" id="prev">Atrás</button>
        <button type="button" id="next">Seguir</button>
      </div>

      <div class="finale" id="finale" hidden>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <div class="finale-card">
          <svg class="gnocchi gnocchi-small" viewBox="0 0 240 150" aria-hidden="true">
            <ellipse cx="120" cy="84" rx="96" ry="48" fill="#fff6dc" stroke="#1c1c1c" stroke-width="4"/>
            <path d="M62 52c10 22 10 48 0 68M100 44c12 24 12 62 0 86M140 44c12 24 12 62 0 86M178 52c10 22 10 48 0 68" fill="none" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="78" cy="96" rx="12" ry="7" fill="#ff8aa0"/>
            <ellipse cx="164" cy="96" rx="12" ry="7" fill="#ff8aa0"/>
            <ellipse cx="98" cy="80" rx="8" ry="11" fill="#1c1c1c"/>
            <ellipse cx="146" cy="80" rx="8" ry="11" fill="#1c1c1c"/>
            <path d="M104 104c8 12 24 12 32 0" fill="none" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round"/>
          </svg>
          <h2>Listo. Domingo 29, ñoquis.</h2>
          <a class="btn btn-yes" id="whatsapp">Avisarle a Max</a>
        </div>
      </div>
    </div>

    <button type="button" class="btn btn-no" id="decline" inert>
      <svg class="mini-face" viewBox="0 0 48 32" aria-hidden="true">
        <g class="calm">
          <circle cx="14" cy="12" r="3" fill="#1c1c1c"/>
          <circle cx="34" cy="12" r="3" fill="#1c1c1c"/>
          <path d="M16 22c4 4 12 4 16 0" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g class="scared">
          <circle cx="14" cy="12" r="4" fill="#1c1c1c"/>
          <circle cx="34" cy="12" r="4" fill="#1c1c1c"/>
          <ellipse cx="24" cy="24" rx="5" ry="6" fill="#1c1c1c"/>
        </g>
      </svg>
      Declinar
    </button>

    <p class="visually-hidden" id="status" role="status"></p>

    <noscript>
      <p class="noscript">Martina, este domingo 29 hay ñoquis de papa. Los hace Max, con la salsa y con cariño.</p>
    </noscript>

    <script type="module" src="script.js"></script>
  </body>
</html>
